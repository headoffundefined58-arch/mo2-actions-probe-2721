# Mirror build channel.
#
# GitHub Actions is disabled on headoffundefined58-arch/modorganizer (a fork of
# ModOrganizer2/modorganizer), so the patched binary is built here and the
# sources are downloaded from the fork at the requested ref. The vendored
# .github/actions/mob-build in this repository is the same action as in the
# patched repo, minus its final "check out this repository" step, plus a step
# that fetches the patched tree as a tarball.
#
# Artifact name matches the original workflow so tools/fetch_build.py --mirror
# can download it unchanged.

name: Build MO2 core (mirror)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Patched source ref in the source repository (branch or sha)'
        required: false
        default: 'master'

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      # Needed so ./.github/actions/mob-build exists in this workspace.
      - uses: actions/checkout@v4

      - name: Build patched ModOrganizer 2
        uses: ./.github/actions/mob-build
        with:
          mo2-owner: ModOrganizer2
          mo2-branch: v2.5.2
          mob-ref: v2.5.2
          qt-version: 6.7.1
          qt-modules: qtpositioning qtwebchannel qtwebengine qtwebsockets
          source-repo: headoffundefined58-arch/modorganizer
          source-ref: ${{ inputs.sha || 'master' }}
          mo2-third-parties: >-
            7z zlib gtest libbsarch libloot openssl bzip2 python lz4 spdlog
            boost boost-di sip pyqt pybind11 ss licenses explorerpp DirectXTex
          mo2-dependencies: >-
            usvfs cmake_common uibase githubpp bsatk esptk archive lootcli
            game_gamebryo

      - name: Collect the built executable
        shell: bash
        run: |
          set -e
          mkdir -p dist
          echo "candidate executables:"
          find . -type f -name 'ModOrganizer.exe' -print
          exe=$(find . -type f -name 'ModOrganizer.exe' -print | grep -i vsbuild | head -1)
          if [ -z "$exe" ]; then
            exe=$(find . -type f -name 'ModOrganizer.exe' -print | head -1)
          fi
          test -n "$exe" || { echo "ModOrganizer.exe not found"; exit 1; }
          cp "$exe" dist/ModOrganizer.exe
          ls -l dist/ModOrganizer.exe

      - name: Upload patched executable
        uses: actions/upload-artifact@v4
        with:
          name: patched-modorganizer-exe
          path: dist/ModOrganizer.exe
          if-no-files-found: error
          retention-days: 14
